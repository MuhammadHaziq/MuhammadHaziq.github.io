services:
  # Production build served by Nginx: http://localhost:8080
  portfolio:
    build:
      context: .
      args:
        CONTACT_EMAIL: ${CONTACT_EMAIL:-}
        CONTACT_WHATSAPP: ${CONTACT_WHATSAPP:-}
    container_name: portfolio
    ports:
      - "8080:80"

  # Dev server with hot reload: docker compose --profile dev up portfolio-dev
  portfolio-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: portfolio-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
      - CONTACT_WHATSAPP=${CONTACT_WHATSAPP:-}
